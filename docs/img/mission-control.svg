<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="mct">
<title id="mct">Kowalski 2.3 Mission Control: a penguin at the console, surrounded by coloured horde tiles, a run list and the ⌘K picker</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0d1a"/><stop offset=".55" stop-color="#141a33"/><stop offset="1" stop-color="#2a0f1a"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ff5a4e" stop-opacity=".55"/><stop offset="1" stop-color="#ff5a4e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowT" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#1fb5a8" stop-opacity=".45"/><stop offset="1" stop-color="#1fb5a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20c4b4"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb627"/><stop offset="1" stop-color="#d9480f"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f9bd1"/><stop offset="1" stop-color="#34507a"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b3fb0"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#c81e1e"/></linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .h { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 800; fill: #fff; letter-spacing: 1px; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tile { fill: #171b2e; stroke: #2c3352; stroke-width: 1.5; }
  .ic { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style>

<rect width="1200" height="560" fill="url(#sky)"/>
<!-- stars -->
<g fill="#fff">
  <circle cx="60" cy="40" r="1.4" opacity=".8"/><circle cx="180" cy="110" r="1" opacity=".6"/><circle cx="320" cy="30" r="1.6" opacity=".9"/>
  <circle cx="470" cy="80" r="1" opacity=".5"/><circle cx="640" cy="24" r="1.3" opacity=".8"/><circle cx="780" cy="60" r="1" opacity=".6"/>
  <circle cx="930" cy="34" r="1.5" opacity=".9"/><circle cx="1090" cy="90" r="1.1" opacity=".7"/><circle cx="1160" cy="30" r="1" opacity=".5"/>
  <circle cx="40" cy="300" r="1.2" opacity=".6"/><circle cx="1170" cy="330" r="1.3" opacity=".7"/><circle cx="110" cy="500" r="1" opacity=".5"/>
  <circle cx="1120" cy="520" r="1.2" opacity=".6"/><circle cx="560" cy="540" r="1" opacity=".4"/>
</g>

<!-- glows -->
<circle cx="600" cy="330" r="300" fill="url(#glow)"/>
<circle cx="200" cy="150" r="200" fill="url(#glowT)"/>

<!-- radar rings and orbit -->
<g fill="none" stroke="#ff5a4e" stroke-opacity=".35">
  <circle cx="600" cy="330" r="150" stroke-width="1.5"/>
  <circle cx="600" cy="330" r="230" stroke-width="1" stroke-dasharray="4 8"/>
  <circle cx="600" cy="330" r="320" stroke-width="1" stroke-opacity=".18"/>
</g>
<path d="M600 330 L600 100 A230 230 0 0 1 792 204 Z" fill="#ff5a4e" fill-opacity=".12"/>

<!-- title -->
<text x="600" y="62" text-anchor="middle" class="h" font-size="44">MISSION CONTROL</text>
<text x="600" y="92" text-anchor="middle" class="m" font-size="15" fill="#ff8a80" letter-spacing="4">KOWALSKI 2.3 · MANY HORDES, ONE CALM SCREEN</text>

<!-- penguin at the centre -->
<g transform="translate(600 345)" filter="url(#soft)">
  <ellipse cx="0" cy="118" rx="70" ry="10" fill="#000" opacity=".35"/>
  <ellipse cx="0" cy="30" rx="72" ry="90" fill="#0b0c10"/>
  <ellipse cx="0" cy="48" rx="48" ry="66" fill="#f7f6f3"/>
  <ellipse cx="-74" cy="40" rx="16" ry="48" fill="#0b0c10" transform="rotate(18 -74 40)"/>
  <ellipse cx="74" cy="40" rx="16" ry="48" fill="#0b0c10" transform="rotate(-38 74 40)"/>
  <circle cx="0" cy="-50" r="52" fill="#0b0c10"/>
  <!-- red headband -->
  <path d="M-50 -66 Q0 -84 50 -66 L52 -52 Q0 -70 -52 -52 Z" fill="url(#red)"/>
  <path d="M50 -62 l26 -12 l-6 16 l18 4 l-30 6 Z" fill="#e02b2b"/>
  <ellipse cx="-19" cy="-40" rx="14" ry="16" fill="#fff"/><ellipse cx="19" cy="-40" rx="14" ry="16" fill="#fff"/>
  <circle cx="-15" cy="-37" r="6.5" fill="#0b0c10"/><circle cx="15" cy="-37" r="6.5" fill="#0b0c10"/>
  <circle cx="-13" cy="-40" r="2" fill="#fff"/><circle cx="17" cy="-40" r="2" fill="#fff"/>
  <path d="M-14 -18 Q0 -8 14 -18 Q0 0 -14 -18 Z" fill="#ffb627"/>
  <ellipse cx="-24" cy="118" rx="20" ry="8" fill="#ffb627"/><ellipse cx="24" cy="118" rx="20" ry="8" fill="#ffb627"/>
  <!-- headset -->
  <path d="M-54 -50 Q-60 -110 0 -106 Q60 -110 54 -50" fill="none" stroke="#9aa0a8" stroke-width="5"/>
  <rect x="-62" y="-60" width="14" height="24" rx="6" fill="#d62828"/>
  <path d="M-55 -38 Q-50 -10 -22 -12" fill="none" stroke="#9aa0a8" stroke-width="3"/>
  <circle cx="-20" cy="-12" r="4" fill="#d62828"/>
</g>

<!-- horde tiles, left -->
<g filter="url(#soft)">
  <g transform="translate(70 150)">
    <rect class="tile" width="260" height="76" rx="14"/>
    <rect x="14" y="14" width="48" height="48" rx="12" fill="url(#teal)"/>
    <g class="ic" transform="translate(38 38)"><rect x="-12" y="-11" width="24" height="22" rx="3"/><path d="M-12 -3 H12 M-12 4 H12 M-4 -11 V11"/></g>
    <text x="76" y="36" fill="#fff" font-weight="700" font-size="16">Spreadsheet Analyst</text>
    <text x="76" y="57" class="m" fill="#7fe3d8" font-size="12">answered 3 questions</text>
  </g>
  <g transform="translate(40 250)">
    <rect class="tile" width="260" height="76" rx="14"/>
    <rect x="14" y="14" width="48" height="48" rx="12" fill="url(#amber)"/>
    <g class="ic" transform="translate(38 40)"><path d="M-13 6 H13 M-8 12 H8 M-8 6 A8 8 0 0 1 8 6 M0 -12 V-7 M-11 -6 L-8 -3 M11 -6 L8 -3"/></g>
    <text x="76" y="36" fill="#fff" font-weight="700" font-size="16">Morning Brief</text>
    <text x="76" y="57" class="m" fill="#ffd28a" font-size="12">next: Mon 07:00</text>
  </g>
  <g transform="translate(70 350)">
    <rect class="tile" width="260" height="76" rx="14"/>
    <rect x="14" y="14" width="48" height="48" rx="12" fill="url(#steel)"/>
    <g class="ic" transform="translate(38 38)"><path d="M-12 2 L-8 -10 H8 L12 2 V10 H-12 Z M-12 2 H-4 L-2 6 H2 L4 2 H12"/></g>
    <text x="76" y="36" fill="#fff" font-weight="700" font-size="16">Folder Watcher</text>
    <text x="76" y="57" class="m" fill="#b3cdef" font-size="12">watching ~/inbox</text>
  </g>
  <g transform="translate(110 450)">
    <rect class="tile" width="220" height="64" rx="14"/>
    <rect x="12" y="10" width="44" height="44" rx="11" fill="url(#violet)"/>
    <g class="ic" transform="translate(34 32)"><path d="M-6 -8 L-12 0 L-6 8 M6 -8 L12 0 L6 8"/></g>
    <text x="68" y="30" fill="#fff" font-weight="700" font-size="15">Release Checker</text>
    <text x="68" y="49" class="m" fill="#cdbdff" font-size="12">+ 96 more hordes</text>
  </g>
</g>

<!-- right: ⌘K picker and runs -->
<g filter="url(#soft)">
  <g transform="translate(860 140)">
    <rect width="300" height="52" rx="26" fill="#f7f6f3"/>
    <circle cx="28" cy="25" r="8" fill="none" stroke="#5f6670" stroke-width="2.4"/><path d="M34 31 L40 37" stroke="#5f6670" stroke-width="2.4" stroke-linecap="round"/>
    <text x="52" y="32" fill="#5f6670" font-size="15">Find a horde or a run…</text>
    <rect x="240" y="14" width="44" height="24" rx="6" fill="#111418"/>
    <text x="262" y="31" text-anchor="middle" class="m" fill="#fff" font-size="13">⌘K</text>
  </g>

  <g transform="translate(860 214)">
    <rect width="300" height="236" rx="16" fill="#171b2e" stroke="#2c3352" stroke-width="1.5"/>
    <text x="20" y="32" class="m" fill="#9aa0a8" font-size="12" letter-spacing="3">RUNS · TODAY</text>
    <g transform="translate(20 50)">
      <rect width="260" height="50" rx="10" fill="#3a1614" stroke="#ff5a4e" stroke-width="1.5"/>
      <circle cx="20" cy="25" r="6" fill="#ff5a4e"/>
      <text x="36" y="22" fill="#fff" font-size="14" font-weight="600">Is the release ready?</text>
      <text x="36" y="39" class="m" fill="#ff8a80" font-size="11.5">needs you · approve</text>
    </g>
    <g transform="translate(20 110)">
      <rect width="260" height="50" rx="10" fill="#1f2540"/>
      <circle cx="20" cy="25" r="6" fill="#ffb627"/>
      <text x="36" y="22" fill="#fff" font-size="14" font-weight="600">What changed in Rust?</text>
      <text x="36" y="39" class="m" fill="#ffd28a" font-size="11.5">running · step 3 of 4</text>
    </g>
    <g transform="translate(20 170)">
      <rect width="260" height="50" rx="10" fill="#1f2540"/>
      <circle cx="20" cy="25" r="6" fill="#20c4b4"/>
      <text x="36" y="22" fill="#fff" font-size="14" font-weight="600">Who spent more than 100?</text>
      <text x="36" y="39" class="m" fill="#7fe3d8" font-size="11.5">done · ask more →</text>
    </g>
  </g>

  <g transform="translate(900 470)">
    <rect width="220" height="50" rx="12" fill="url(#red)"/>
    <text x="110" y="31" text-anchor="middle" fill="#fff" font-weight="800" font-size="16" letter-spacing="1">SEND IN THE HORDE</text>
  </g>
</g>

<!-- links from penguin to tiles and runs -->
<g fill="none" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity=".7">
  <path d="M520 300 C440 260 400 200 330 188" stroke="#20c4b4"/>
  <path d="M520 340 C430 320 380 290 300 288" stroke="#ffb627"/>
  <path d="M520 380 C440 390 400 390 330 388" stroke="#6f9bd1"/>
  <path d="M680 300 C760 270 800 250 860 250" stroke="#ff5a4e"/>
  <path d="M680 370 C760 380 800 360 860 340" stroke="#ff5a4e"/>
</g>
</svg>
