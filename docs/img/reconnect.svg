<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="rct">
<title id="rct">Kowalski 2.4 Reconnect: a penguin plugs a cable into a tableski server that just started, while retry pulses at 5, 10 and 20 seconds travel along the line</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0d1a"/><stop offset=".55" stop-color="#101f33"/><stop offset="1" stop-color="#062a2a"/>
  </linearGradient>
  <radialGradient id="glowR" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff5a4e" stop-opacity=".5"/><stop offset="1" stop-color="#ff5a4e" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowT" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#20c4b4" stop-opacity=".55"/><stop offset="1" stop-color="#20c4b4" stop-opacity="0"/></radialGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20c4b4"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#c81e1e"/></linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb627"/><stop offset="1" stop-color="#d9480f"/></linearGradient>
  <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a4e"/><stop offset=".5" stop-color="#ffb627"/><stop offset="1" stop-color="#20c4b4"/></linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .h { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 800; fill: #fff; letter-spacing: 1px; }
</style>
<rect width="1200" height="560" fill="url(#sky)"/>
<g fill="#fff">
  <circle cx="70" cy="50" r="1.5" opacity=".8"/><circle cx="240" cy="120" r="1" opacity=".6"/><circle cx="420" cy="36" r="1.6" opacity=".9"/>
  <circle cx="610" cy="90" r="1" opacity=".5"/><circle cx="800" cy="30" r="1.4" opacity=".8"/><circle cx="1000" cy="70" r="1.2" opacity=".7"/>
  <circle cx="1150" cy="140" r="1" opacity=".5"/><circle cx="40" cy="330" r="1.2" opacity=".6"/><circle cx="1170" cy="480" r="1.3" opacity=".6"/>
  <circle cx="580" cy="530" r="1" opacity=".4"/>
</g>
<circle cx="300" cy="340" r="260" fill="url(#glowR)"/>
<circle cx="920" cy="320" r="260" fill="url(#glowT)"/>

<text x="600" y="64" text-anchor="middle" class="h" font-size="46">RECONNECT</text>
<text x="600" y="94" text-anchor="middle" class="m" font-size="15" fill="#7fe3d8" letter-spacing="4">KOWALSKI 2.4 · START TABLESKI WHENEVER YOU LIKE</text>

<!-- the cable -->
<path d="M395 360 C520 360 540 250 660 250 S800 330 850 330" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="16" stroke-linecap="round"/>
<path d="M395 352 C520 352 540 242 660 242 S800 322 850 322" fill="none" stroke="url(#cable)" stroke-width="10" stroke-linecap="round"/>
<!-- retry pulses along the cable -->
<g filter="url(#soft)">
  <g transform="translate(500 318)"><circle r="22" fill="#171b2e" stroke="#ff5a4e" stroke-width="3"/><text y="6" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#ff8a80">5s</text></g>
  <g transform="translate(640 222)"><circle r="24" fill="#171b2e" stroke="#ffb627" stroke-width="3"/><text y="6" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#ffd28a">10s</text></g>
  <g transform="translate(772 290)"><circle r="26" fill="#20c4b4"/><text y="6" text-anchor="middle" class="m" font-size="16" font-weight="800" fill="#fff">✓</text></g>
</g>
<text x="640" y="176" text-anchor="middle" class="m" font-size="13" fill="#9aa0a8" letter-spacing="2">RETRYING…</text>

<!-- tableski server, right -->
<g filter="url(#soft)" transform="translate(850 190)">
  <rect width="270" height="250" rx="22" fill="#f7f6f3"/>
  <rect width="270" height="60" rx="22" fill="url(#teal)"/><rect y="40" width="270" height="20" fill="#0e7490"/>
  <text x="24" y="39" fill="#fff" font-weight="800" font-size="22">tableski</text>
  <circle cx="236" cy="30" r="8" fill="#b8ffea"/><circle cx="236" cy="30" r="14" fill="none" stroke="#b8ffea" stroke-opacity=".5" stroke-width="3"/>
  <g font-size="16" fill="#2b2f36">
    <rect x="20" y="80" width="230" height="44" rx="10" fill="#e6f6f4"/><text x="36" y="108" font-weight="700">people</text><text x="236" y="108" text-anchor="end" class="m" fill="#0e7490">3 rows</text>
    <rect x="20" y="134" width="230" height="44" rx="10" fill="#e6f6f4"/><text x="36" y="162" font-weight="700">orders</text><text x="236" y="162" text-anchor="end" class="m" fill="#0e7490">3 rows</text>
    <text x="20" y="214" class="m" font-size="13" fill="#5f6670">5 tools · connected</text>
  </g>
  <rect x="-22" y="118" width="30" height="34" rx="6" fill="#2b2f36"/>
</g>

<!-- penguin holding the plug, left -->
<g transform="translate(290 360)" filter="url(#soft)">
  <ellipse cx="0" cy="130" rx="80" ry="12" fill="#000" opacity=".35"/>
  <ellipse cx="0" cy="36" rx="80" ry="100" fill="#0b0c10"/>
  <ellipse cx="0" cy="56" rx="54" ry="74" fill="#f7f6f3"/>
  <ellipse cx="-82" cy="40" rx="18" ry="54" fill="#0b0c10" transform="rotate(18 -82 40)"/>
  <ellipse cx="86" cy="-4" rx="18" ry="56" fill="#0b0c10" transform="rotate(-72 86 -4)"/>
  <rect x="108" y="-22" width="34" height="30" rx="6" fill="#d62828"/>
  <rect x="140" y="-16" width="14" height="5" rx="2" fill="#c9ccd2"/><rect x="140" y="-3" width="14" height="5" rx="2" fill="#c9ccd2"/>
  <circle cx="0" cy="-56" r="58" fill="#0b0c10"/>
  <path d="M-56 -74 Q0 -94 56 -74 L58 -58 Q0 -78 -58 -58 Z" fill="url(#red)"/>
  <path d="M-56 -70 l-28 -12 l6 18 l-20 4 l32 6 Z" fill="#e02b2b"/>
  <ellipse cx="-20" cy="-44" rx="15" ry="18" fill="#fff"/><ellipse cx="20" cy="-44" rx="15" ry="18" fill="#fff"/>
  <circle cx="-14" cy="-41" r="7" fill="#0b0c10"/><circle cx="24" cy="-41" r="7" fill="#0b0c10"/>
  <circle cx="-12" cy="-44" r="2.2" fill="#fff"/><circle cx="26" cy="-44" r="2.2" fill="#fff"/>
  <path d="M-15 -20 Q0 -9 15 -20 Q0 0 -15 -20 Z" fill="#ffb627"/>
  <ellipse cx="-26" cy="130" rx="22" ry="9" fill="#ffb627"/><ellipse cx="26" cy="130" rx="22" ry="9" fill="#ffb627"/>
</g>

<!-- log line bottom -->
<g transform="translate(160 488)">
  <rect width="880" height="44" rx="12" fill="#0b0c10" fill-opacity=".7" stroke="#2c3352"/>
  <text x="22" y="28" class="m" font-size="14" fill="#9aa0a8">INFO  MCP server 'tableski' <tspan fill="#7fe3d8">connected after a retry</tspan> · exposed 5 tool(s)</text>
</g>
</svg>
