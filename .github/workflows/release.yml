# Pre-built binaries on every version tag: `kowalski` (server with the UI and built-in hordes
# inside) plus `kowalski-cli` (which the server runs for isolated steps), per platform.
# Asset names carry no version so `releases/latest/download/<asset>` is a stable link for install.sh.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel-mac runners are retired; cross-compile on Apple Silicon.
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - name: Build the UI (compiled into the server)
        working-directory: ui
        run: bun install --frozen-lockfile && bun run build

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p kowalski -p kowalski-cli

      - name: Package
        run: |
          out="kowalski-${{ matrix.target }}"
          mkdir "$out"
          cp target/${{ matrix.target }}/release/kowalski target/${{ matrix.target }}/release/kowalski-cli "$out/"
          cp README.md LICENSE* config.example.toml "$out/" 2>/dev/null || true
          tar czf "$out.tar.gz" "$out"
          shasum -a 256 "$out.tar.gz" > "$out.tar.gz.sha256"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            kowalski-*.tar.gz
            kowalski-*.tar.gz.sha256

      - name: Keep as a workflow artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: kowalski-${{ matrix.target }}
          path: kowalski-*.tar.gz*
