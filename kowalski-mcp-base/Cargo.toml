[package]
name = "kowalski-mcp-base"
version = "1.6.0"
edition = "2024"
description = "Shared framework for first-party Kowalski MCP servers: transport, framing, credential forwarding, rmcp bootstrap"
license = "MIT"
authors = ["yarenty <yarenty@gmail.com>"]
repository = "https://github.com/yarenty/kowalski"
homepage = "https://github.com/yarenty/kowalski"
readme = "README.md"

[lib]
name = "kowalski_mcp_base"
path = "src/lib.rs"

[dependencies]
# Lightweight JSON-RPC transport (McpHandler path)
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# rmcp ServerHandler bootstrap + framing helpers
rmcp = { version = "1.7", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
tokio-util = { version = "0.7", features = ["rt"] }
http = "1"
uuid = { workspace = true, features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
