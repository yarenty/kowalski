[ollama]
host = "localhost"
port = 11434
# model = "llama3.2"
model = "gemma4:e2b"

# LLM backend: `ollama` (above) or `openai` (Chat Completions — OpenAI, Groq, LM Studio, vLLM, …)
# [llm]
# provider = "openai"
# openai_api_key = "sk-..." # or "" for some local servers
# openai_api_base = "https://api.openai.com/v1"  # or "http://127.0.0.1:1234/v1" for LM Studio

[chat]
temperature = 0.7
max_tokens = 512
stream = true

[search]
provider = "bing"
api_key = ""  # DuckDuckGo doesn't require an API key

[memory]
episodic_path = "db/episodic_buffer"

[horde]
clean_on_startup = true

# MCP servers (optional) — used by agents and: cargo run -p kowalski-cli -- mcp ping
# DataFusion MCP (Docker): docker compose -f kowalski-mcp-datafusion/docker-compose.yml up — POST JSON-RPC to server root
# [[mcp.servers]]
# name = "datafusion"
# url = "http://127.0.0.1:8080/"
# transport = "http"   # or "sse" — both use Streamable HTTP + optional SSE responses
# headers = { Authorization = "Bearer your-token" }

# Docker MCP gateway (recommended — one stdio connection to the Docker MCP Toolkit catalog).
# Requires Docker Desktop + MCP Toolkit (`docker mcp version`). Enable/disable individual
# servers in Docker Desktop; Kowalski connects to all of them through this single entry.
#
# Default (no flags) = "dynamic" mode: exposes gateway management tools (mcp-find, mcp-add,
# mcp-exec, code-mode) so an agent can discover/run catalog tools on demand. Zero config.
# [[mcp.servers]]
# name = "docker-mcp"
# transport = "stdio"
# command = ["docker", "mcp", "gateway", "run"]
#
# Direct mode: expose a specific server's tools by name (the server must be installed and
# configured — including any secrets/OAuth — in Docker Desktop first; tools appear once its
# container is ready). Use `--profile <id>` to load a saved profile instead of `--servers`.
# [[mcp.servers]]
# name = "docker-mcp-github"
# transport = "stdio"
# command = ["docker", "mcp", "gateway", "run", "--servers", "github"]
